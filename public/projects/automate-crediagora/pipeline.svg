<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline da automação Crediagora</title><desc id="desc">Diagrama conceitual das etapas de extração, validação, transformação e atualização das bases.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0d2033"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#56b8ff"/><stop offset="1" stop-color="#68ead1"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><path d="M0 120H1440M0 300H1440M0 480H1440M0 660H1440M180 0V900M420 0V900M660 0V900M900 0V900M1140 0V900" stroke="#7fc8ff" stroke-opacity=".05"/>
  <text x="90" y="105" fill="#7ba8cb" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">AUTOMATE CREDIAGORA / PIPELINE OPERACIONAL</text>
  <text x="90" y="175" fill="#eef7ff" font-family="Arial,sans-serif" font-size="52" font-weight="700">Da extração ao dado pronto.</text><text x="90" y="218" fill="#8ea9bf" font-family="Arial,sans-serif" font-size="21">Fluxo conceitual das rotinas coordenadas em Python.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(90 330)"><rect width="255" height="250" rx="20" fill="#0d1c2b" stroke="#4a8fbd"/><circle cx="48" cy="50" r="18" fill="#173b58"/><text x="48" y="57" fill="#67c5ff" text-anchor="middle" font-size="20">01</text><text x="30" y="112" fill="#e7f4ff" font-size="28" font-weight="700">Extrair</text><text x="30" y="151" fill="#8da9be" font-size="17">Portais e relatórios</text><text x="30" y="182" fill="#8da9be" font-size="17">CSV e planilhas</text><rect x="30" y="207" width="90" height="4" rx="2" fill="url(#accent)"/></g>
  <path d="M355 455H430" stroke="#57bfff" stroke-width="3" stroke-dasharray="8 8"/><path d="m421 445 12 10-12 10" fill="none" stroke="#57bfff" stroke-width="3"/>
  <g transform="translate(440 330)"><rect width="255" height="250" rx="20" fill="#0d1c2b" stroke="#4a8fbd"/><circle cx="48" cy="50" r="18" fill="#173b58"/><text x="48" y="57" fill="#67c5ff" text-anchor="middle" font-size="20">02</text><text x="30" y="112" fill="#e7f4ff" font-size="28" font-weight="700">Validar</text><text x="30" y="151" fill="#8da9be" font-size="17">Origem e estrutura</text><text x="30" y="182" fill="#8da9be" font-size="17">Integridade dos arquivos</text><rect x="30" y="207" width="120" height="4" rx="2" fill="url(#accent)"/></g>
  <path d="M705 455H780" stroke="#57bfff" stroke-width="3" stroke-dasharray="8 8"/><path d="m771 445 12 10-12 10" fill="none" stroke="#57bfff" stroke-width="3"/>
  <g transform="translate(790 330)"><rect width="255" height="250" rx="20" fill="#0d1c2b" stroke="#4a8fbd"/><circle cx="48" cy="50" r="18" fill="#173b58"/><text x="48" y="57" fill="#67c5ff" text-anchor="middle" font-size="20">03</text><text x="30" y="112" fill="#e7f4ff" font-size="28" font-weight="700">Transformar</text><text x="30" y="151" fill="#8da9be" font-size="17">Pandas + OpenPyXL</text><text x="30" y="182" fill="#8da9be" font-size="17">Regras e fórmulas</text><rect x="30" y="207" width="155" height="4" rx="2" fill="url(#accent)"/></g>
  <path d="M1055 455H1130" stroke="#57bfff" stroke-width="3" stroke-dasharray="8 8"/><path d="m1121 445 12 10-12 10" fill="none" stroke="#57bfff" stroke-width="3"/>
  <g transform="translate(1140 330)"><rect width="210" height="250" rx="20" fill="#10261f" stroke="#54b799"/><circle cx="48" cy="50" r="18" fill="#16483a"/><text x="48" y="57" fill="#68ead1" text-anchor="middle" font-size="20">04</text><text x="30" y="112" fill="#eafff9" font-size="28" font-weight="700">Atualizar</text><text x="30" y="151" fill="#91b9ad" font-size="17">Bases prontas</text><text x="30" y="182" fill="#91b9ad" font-size="17">Logs e backups</text><text x="30" y="221" fill="#68ead1" font-size="19" font-weight="700">CONCLUÍDO ✓</text></g></g>
  <g transform="translate(90 690)" font-family="Consolas,monospace"><rect width="1260" height="120" rx="16" fill="#050b12" stroke="#27455f"/><circle cx="30" cy="28" r="6" fill="#ff6b77"/><circle cx="52" cy="28" r="6" fill="#f4c95d"/><circle cx="74" cy="28" r="6" fill="#68ead1"/><text x="30" y="73" fill="#75bfff" font-size="18">pipeline.run()</text><text x="196" y="73" fill="#9fb1c1" font-size="18">exportar → conferir → substituir com segurança</text><text x="30" y="99" fill="#58d5b4" font-size="16">✓ execução monitorada por etapa</text></g>
</svg>
